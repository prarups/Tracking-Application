version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tracking_db
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p@ssw0rd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tracking_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracking_backend
    command: gunicorn tracking_core.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=tracking
      - DB_USER=postgres
      - DB_PASSWORD=p@ssw0rd
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  channels:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracking_channels
    command: daphne -b 0.0.0.0 -p 8001 tracking_core.asgi:application
    volumes:
      - ./backend:/app
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=tracking
      - DB_USER=postgres
      - DB_PASSWORD=p@ssw0rd
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracking_celery
    command: celery -A tracking_core worker -l info --concurrency=4
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=tracking
      - DB_USER=postgres
      - DB_PASSWORD=p@ssw0rd
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracking_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - channels

volumes:
  postgres_data:
  media_data:
